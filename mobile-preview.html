<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HeatShield · 手机 App</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#21201c;background:#f1f0ef;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100svh}header{height:64px;max-width:1080px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.identity{display:flex;gap:9px;align-items:center;font-size:14px;font-weight:600;letter-spacing:-.3px}.identity svg{width:26px;height:26px;flex-shrink:0}.identity small{font-size:11px;font-weight:400;color:#63635e;margin-left:5px}.actions{display:flex;gap:8px;align-items:center}button,a{font:inherit;font-size:12px;line-height:1.5;color:#63635e;border:1px solid #dad9d6;border-radius:7px;background:#fdfdfc;min-height:34px;padding:7px 10px;text-decoration:none;cursor:pointer}button:hover,a:hover{color:#21201c;background:#fff}button:focus-visible,a:focus-visible{outline:2px solid #c25132;outline-offset:3px}.preview{display:flex;justify-content:center;align-items:flex-start;padding:6px 16px 24px}.viewport-stage{position:relative;flex-shrink:0;width:390px;height:844px}iframe{position:absolute;top:0;left:0;width:390px;height:844px;display:block;border:0;outline:1px solid #cfceca;border-radius:12px;background:#fdfdfc;box-shadow:0 12px 40px #21201c0d;transform-origin:top left}footer{font-size:10px;color:#82827c;text-align:center;padding:0 16px 15px;letter-spacing:.1px}@media(max-width:520px){header{padding:0 16px;gap:8px;height:58px}.identity small{display:none}.actions{gap:5px}button,a{font-size:11px;padding:7px 8px}.preview{padding-top:4px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media(max-width:520px){.identity{font-size:13px;gap:6px}.identity svg{width:24px;height:24px}.actions{gap:4px}.actions button,.actions a{font-size:10px;padding:6px;min-height:32px}}@media(max-width:359px){.actions a{display:none}}
</style></head>
<body><header><div class="identity"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#DF6546"/><path d="M17 14h30v17c0 11-15 20-15 20S17 42 17 31V14Z" fill="none" stroke="#FFF8EE" stroke-width="3.5" stroke-linejoin="round"/><circle cx="32" cy="24" r="5" fill="#FFD29C"/><path d="M24 35h16M27 42h10" stroke="#FFF8EE" stroke-width="3.5" stroke-linecap="round"/></svg>HeatShield<small>390 × 844 · 手机视口</small></div><div class="actions"><button id="restart-app" type="button">重新体验</button><button id="scale-toggle" type="button" aria-pressed="false">实际大小</button><a id="fullscreen-app" href="HeatShield.html?v=20261114-bilingual" target="_blank" rel="noopener">全屏打开 ↗</a></div></header>
<main class="preview"><div class="viewport-stage" id="stage"><iframe id="app" src="about:blank" title="HeatShield 手机 App" width="390" height="844"></iframe></div></main><footer id="hint">固定手机视口 · 在 App 内自然滑动</footer>
<script>
(()=>{
 const stage=document.getElementById('stage'),frame=document.getElementById('app'),toggle=document.getElementById('scale-toggle'),query=new URLSearchParams(location.search);let actual=false,language='zh',hasSavedLanguage=false;
 const copy={
  zh:{title:'HeatShield · 手机 App',viewport:'390 × 844 · 手机视口',restart:'重新体验',actual:'实际大小',fit:'适应窗口',full:'全屏打开 ↗',frame:'HeatShield 手机 App',hint:p=>'390 × 844 手机视口 · '+p+'% 显示 · 在 App 内滑动'},
  en:{title:'HeatShield · Mobile app',viewport:'390 × 844 · Phone viewport',restart:'Start again',actual:'Actual size',fit:'Fit to window',full:'Open full screen ↗',frame:'HeatShield mobile app',hint:p=>'390 × 844 phone viewport · '+p+'% scale · Scroll inside the app'}
 };
 try{const saved=JSON.parse(localStorage.getItem(query.has('qa')?'heatshield.app.v3.qa':'heatshield.app.v3')||'{}');if(copy[saved.language]){language=saved.language;hasSavedLanguage=true}}catch{}
 if(!hasSavedLanguage&&copy[query.get('lang')])language=query.get('lang');
 const params=new URLSearchParams({v:'20261114-bilingual'});for(const key of ['lang','qa'])if(query.has(key))params.set(key,query.get(key));
 const view=query.get('view');if(view==='3d')params.set('layer','3d');
 const appURL='HeatShield.html?'+params+(view==='3d'||view==='map'?'#map':'');
 document.getElementById('fullscreen-app').href=appURL;
 function fit(){const s=actual?1:Math.max(.15,Math.min(1,(innerWidth-32)/390,(innerHeight-102)/844));stage.style.width=(390*s)+'px';stage.style.height=(844*s)+'px';frame.style.transform='scale('+s+')';toggle.textContent=actual?copy[language].fit:copy[language].actual;toggle.setAttribute('aria-pressed',String(actual));document.getElementById('hint').textContent=copy[language].hint(Math.round(s*100))}
 function translate(){const c=copy[language];document.documentElement.lang=language==='en'?'en':'zh-CN';document.title=c.title;document.querySelector('.identity small').textContent=c.viewport;document.getElementById('restart-app').textContent=c.restart;document.getElementById('fullscreen-app').textContent=c.full;frame.title=c.frame;fit()}
 addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='heatshield-language'&&copy[e.data.language]){language=e.data.language;translate()}});
 document.getElementById('restart-app').addEventListener('click',()=>{const restart=new URLSearchParams({v:'20261114-bilingual',launch:String(Date.now()),lang:language});if(query.has('qa'))restart.set('qa',query.get('qa'));frame.src='HeatShield.html?'+restart});
 toggle.addEventListener('click',()=>{actual=!actual;fit()});addEventListener('resize',fit);translate();frame.src=appURL;
})();
</script></body></html>
